<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onlayn shashka</title>
<style>
:root{--bg:#231a33;--panel:#32244a;--ink:#f6f0e4;--mute:#b6a7d0;--light:#ead8b3;--dark:#7b3a2c;--gold:#f0b23a;--move:rgba(240,178,58,.8);--last:rgba(240,178,58,.32)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
main{max-width:560px;margin:0 auto;padding:18px 14px 32px}
h1{font-size:1.7rem;margin:6px 0 14px}
.card{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:1.05rem;margin:0 0 10px;font-weight:600}
.code{font-size:2rem;letter-spacing:6px;font-weight:700;background:#1a1228;border-radius:10px;padding:10px 14px;display:inline-block;margin:4px 0 10px;user-select:all}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:0;font:inherit;font-size:1.2rem;padding:10px 12px;border-radius:10px;border:2px solid #57407f;background:#1a1228;color:var(--ink);text-transform:lowercase}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;font-size:1rem;padding:10px 16px;border-radius:10px;border:0;background:var(--gold);color:#2a1d00;font-weight:700;cursor:pointer}
button.alt{background:#57407f;color:var(--ink)}
.hint{color:var(--mute);font-size:.92rem;margin:8px 0 0}
#status{font-size:1.15rem;font-weight:700;min-height:1.6em;margin:0 0 10px}
#status.warn{color:var(--gold)}
#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;max-width:560px;aspect-ratio:1/1;border-radius:8px;overflow:hidden;touch-action:manipulation}
.sq{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden;cursor:pointer;user-select:none}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--last)}
.sq.sel{box-shadow:inset 0 0 0 4px var(--gold)}
.sq.via::before{content:"";position:absolute;inset:0;background:rgba(240,178,58,.4)}
.sq.tgt::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:var(--move)}
.coord{position:absolute;font:600 .6rem system-ui,sans-serif;opacity:.75;z-index:1}
.coord.f{right:3px;bottom:2px}.coord.r{left:3px;top:2px}
.sq.l .coord{color:var(--dark)}.sq.d .coord{color:var(--light)}
.disc{position:relative;z-index:1;width:78%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:min(6.4vw,34px);line-height:1}
.disc.w{background:radial-gradient(circle at 35% 30%,#fff,#ebe3ce 60%,#c4b99d);box-shadow:0 2px 0 #8d8368,inset 0 0 0 4px rgba(0,0,0,.08),inset 0 0 0 7px rgba(255,255,255,.35)}
.disc.b{background:radial-gradient(circle at 35% 30%,#51515d,#1a1a20 65%);box-shadow:0 2px 0 #000,inset 0 0 0 4px rgba(255,255,255,.08),inset 0 0 0 7px rgba(0,0,0,.3)}
.disc.can{outline:3px solid rgba(240,178,58,.9);outline-offset:1px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Onlayn shashka</h1>

<section id="lobby">
  <div class="card">
    <h2>Sizning kodingiz</h2>
    <div class="code" id="myCode">…</div>
    <div class="row"><button id="copy" class="alt">Nusxalash</button></div>
    <p class="hint">Kodni do'stingizga yuboring va u ulanishini kuting. Siz oq donalar bilan o'ynaysiz va birinchi yurasiz.</p>
  </div>
  <div class="card">
    <h2>Do'stingiz kodi bilan ulanish</h2>
    <div class="row">
      <input id="friendCode" maxlength="5" placeholder="abcde" autocomplete="off" autocapitalize="none">
      <button id="join">Ulanish</button>
    </div>
    <p class="hint" id="lobbyMsg"></p>
  </div>
  <div class="card">
    <h2>Bitta qurilmada</h2>
    <button id="local" class="alt">Ikki kishi bitta ekranda</button>
  </div>
</section>

<section id="game" class="hide">
  <p id="status"></p>
  <div id="board" role="grid" aria-label="Shashka taxtasi"></div>
  <div class="bar">
    <span id="who" class="hint"></span>
    <span>
      <button id="resign" class="alt">Taslim bo'lish</button>
      <button id="again" class="alt hide">Yangi o'yin</button>
    </span>
  </div>
  <p class="hint">Urish majburiy. Ketma-ket urishda har bir qo'nish katagini bosing.</p>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
/* ============ SHASHKA QOIDALARI (rus shashkasi) ============
 - Faqat to'q kataklarda o'ynaladi, oddiy dona oldinga yuradi
 - Oddiy dona oldinga ham, orqaga ham uradi
 - Dama (shoh) istalgan masofaga yuradi va uradi
 - Urish majburiy; urish tugamaguncha davom etadi
 - Urish paytida oxirgi qatorga yetgan dona damaga aylanib, urishni davom ettiradi
 - Urilgan dona urish tugagach olinadi (bir donani ikki marta urib bo'lmaydi)
 - Yurish qila olmagan o'yinchi yutqazadi
*/
const DIRS=[[-1,-1],[-1,1],[1,-1],[1,1]];
const inB=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const colOf=p=>p.toLowerCase(), isK=p=>p===p.toUpperCase(), opp=c=>c==='w'?'b':'w';
const promoRow=(col,sq)=>col==='w'?(sq>>3)===0:(sq>>3)===7;

function newState(){
  const b=Array(64).fill(null);
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1){if(r<3)b[r*8+c]='b';else if(r>4)b[r*8+c]='w';}
  return {b,turn:'w'};
}

/* urish ketma-ketliklari */
function ext(b,pos,king,col,caps,from){
  const res=[],empty=sq=>b[sq]===null||sq===from;
  for(const[dr,dc]of DIRS){
    let r=(pos>>3)+dr,c=(pos&7)+dc,victim=-1;const lands=[];
    if(king){
      while(inB(r,c)&&empty(r*8+c)){r+=dr;c+=dc;}
      if(!inB(r,c))continue;
      const v=r*8+c,p=b[v];
      if(!p||colOf(p)===col||caps.includes(v))continue;
      victim=v;r+=dr;c+=dc;
      while(inB(r,c)&&empty(r*8+c)){lands.push(r*8+c);r+=dr;c+=dc;}
    }else{
      if(!inB(r,c))continue;
      const v=r*8+c,p=b[v];
      if(!p||colOf(p)===col||caps.includes(v))continue;
      const lr=r+dr,lc=c+dc;
      if(!inB(lr,lc)||!empty(lr*8+lc))continue;
      victim=v;lands.push(lr*8+lc);
    }
    if(!lands.length)continue;
    const sub=[],term=[];
    for(const land of lands){
      const nk=king||promoRow(col,land),e=ext(b,land,nk,col,caps.concat(victim),from);
      if(e.length)for(const x of e)sub.push({path:[land,...x.path],caps:[victim,...x.caps],king:x.king});
      else term.push({path:[land],caps:[victim],king:nk});
    }
    res.push(...(sub.length?sub:term));
  }
  return res;
}
function simple(b,i,p){
  const out=[],r=i>>3,c=i&7;
  if(isK(p)){
    for(const[dr,dc]of DIRS){let rr=r+dr,cc=c+dc;
      while(inB(rr,cc)&&!b[rr*8+cc]){out.push({from:i,path:[rr*8+cc],caps:[]});rr+=dr;cc+=dc;}}
  }else{
    const d=colOf(p)==='w'?-1:1;
    for(const dc of[-1,1]){const rr=r+d,cc=c+dc;if(inB(rr,cc)&&!b[rr*8+cc])out.push({from:i,path:[rr*8+cc],caps:[]});}
  }
  return out;
}
function legal(s){
  const caps=[],sims=[];
  for(let i=0;i<64;i++){const p=s.b[i];if(!p||colOf(p)!==s.turn)continue;
    for(const x of ext(s.b,i,isK(p),s.turn,[],i))caps.push({from:i,path:x.path,caps:x.caps,king:x.king});}
  if(caps.length)return caps;
  for(let i=0;i<64;i++){const p=s.b[i];if(p&&colOf(p)===s.turn)sims.push(...simple(s.b,i,p));}
  return sims;
}
function apply(s,m){
  const b=s.b.slice();let p=b[m.from];b[m.from]=null;
  for(const v of m.caps)b[v]=null;
  const end=m.path[m.path.length-1],col=colOf(p);
  if(!isK(p)&&(m.king||promoRow(col,end)))p=p.toUpperCase();
  b[end]=p;
  return {b,turn:opp(col)};
}

/* ============ O'YIN HOLATI ============ */
let S=newState(),my=null,lastMove=null,sel=-1,partial=[],over=false,conn=null,peer=null,flip=false;
const $=id=>document.getElementById(id);
const NAMES={w:'Oq',b:'Qora'};

function startGame(color){
  S=newState();my=color;lastMove=null;sel=-1;partial=[];over=false;flip=color==='b';
  $('lobby').classList.add('hide');$('game').classList.remove('hide');
  $('who').textContent=color?`Siz: ${NAMES[color]} donalar`:"Bitta qurilmada o'yin";
  $('resign').classList.toggle('hide',!color);$('again').classList.add('hide');
  render();
}
function cands(mv){return sel<0?[]:mv.filter(m=>m.from===sel&&partial.every((q,k)=>m.path[k]===q));}
function render(){
  const el=$('board');el.innerHTML='';
  const mv=legal(S),mustCap=mv.length&&mv[0].caps.length>0,movable=new Set(mv.map(m=>m.from));
  const targets=new Set(cands(mv).filter(m=>m.path.length>partial.length).map(m=>m.path[partial.length]));
  const mine=!my||my===S.turn;
  for(let v=0;v<64;v++){
    const i=flip?63-v:v,r=i>>3,c=i&7,p=S.b[i];
    const d=document.createElement('div');
    d.className='sq '+((r+c)%2?'d':'l');
    if(lastMove&&(i===lastMove.from||i===lastMove.to))d.classList.add('last');
    if(i===sel)d.classList.add('sel');
    if(partial.includes(i))d.classList.add('via');
    if(targets.has(i))d.classList.add('tgt');
    if(v%8===0){const x=document.createElement('span');x.className='coord r';x.textContent=8-r;d.appendChild(x);}
    if(v>=56){const x=document.createElement('span');x.className='coord f';x.textContent='abcdefgh'[c];d.appendChild(x);}
    if(p){
      const s=document.createElement('div');
      s.className='disc '+colOf(p)+(isK(p)?' k':'')+(mustCap&&mine&&!over&&!partial.length&&colOf(p)===S.turn&&movable.has(i)?' can':'');
      if(isK(p))s.textContent='♛\uFE0E';
      d.appendChild(s);
    }
    d.onclick=()=>click(i);
    el.appendChild(d);
  }
  const st=$('status');st.className='';
  if(!over&&!mv.length){over=true;const w=opp(S.turn);
    st.textContent=`${NAMES[w]} yutdi`+(my?(my===w?' — siz yutdingiz 🎉':' — siz yutqazdingiz'):'');}
  else if(!over){
    st.textContent=my?(mine?'Sizning navbatingiz':'Raqib navbati'):`${NAMES[S.turn]} yuradi`;
    if(mustCap&&mine){st.textContent+=" — urish majburiy!";st.className='warn';}
  }
  if(over){$('again').classList.remove('hide');$('resign').classList.add('hide');}
}
function click(i){
  if(over||(my&&S.turn!==my))return;
  const mv=legal(S);
  if(sel>=0){
    const next=cands(mv).filter(m=>m.path.length>partial.length&&m.path[partial.length]===i);
    if(next.length){
      partial.push(i);
      const done=next.find(m=>m.path.length===partial.length);
      if(done){play(done,true);return;}
      render();return;
    }
    if(partial.length){if(i===sel){sel=-1;partial=[];render();}return;}
  }
  const p=S.b[i];
  sel=(p&&colOf(p)===S.turn&&mv.some(m=>m.from===i))?i:-1;partial=[];
  render();
}
function play(m,send){
  S=apply(S,m);lastMove={from:m.from,to:m.path[m.path.length-1]};sel=-1;partial=[];
  if(send&&conn&&conn.open)conn.send({t:'move',from:m.from,path:m.path});
  render();
}

/* ============ ONLAYN (PeerJS / WebRTC) ============ */
const PREFIX='yulduz-shashka-',ALPHA='23456789abcdefghjkmnpqrstuvwxyz';
const rnd=()=>Array.from({length:5},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');
let myCode=rnd();

function initPeer(){
  peer=new Peer(PREFIX+myCode);
  peer.on('open',()=>{$('myCode').textContent=myCode;});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){myCode=rnd();initPeer();return;}
    $('lobbyMsg').textContent=e.type==='peer-unavailable'?"Bunday kod topilmadi. Kodni tekshiring.":"Ulanishda xato: "+e.type;
  });
  peer.on('connection',c=>{if(conn&&conn.open){c.close();return;}conn=c;wire(c,'w');});
}
function endUI(msg,bad){over=true;$('status').textContent=msg;$('status').className=bad?'warn':'';$('again').classList.remove('hide');$('resign').classList.add('hide');}
function wire(c,color){
  const go=()=>startGame(color);
  if(c.open)go();else c.on('open',go);
  c.on('data',d=>{
    if(!d)return;
    if(d.t==='move'&&!over&&S.turn!==my){
      const m=legal(S).find(x=>x.from===d.from&&JSON.stringify(x.path)===JSON.stringify(d.path));
      if(m)play(m,false);
    }
    if(d.t==='resign'&&!over)endUI("Raqib taslim bo'ldi — siz yutdingiz 🎉");
  });
  c.on('close',()=>{if(!over)endUI("Raqib o'yindan chiqdi",true);});
}
$('join').onclick=()=>{
  const code=$('friendCode').value.trim().toLowerCase();
  if(code.length<5){$('lobbyMsg').textContent='5 belgili kodni kiriting.';return;}
  if(code===myCode){$('lobbyMsg').textContent="Bu sizning kodingiz. Do'stingiz kodini kiriting.";return;}
  $('lobbyMsg').textContent='Ulanmoqda…';
  conn=peer.connect(PREFIX+code,{reliable:true});
  wire(conn,'b');
};
$('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(myCode);$('copy').textContent='Nusxalandi ✓';}catch(e){$('copy').textContent=myCode;}
  setTimeout(()=>$('copy').textContent='Nusxalash',1800);
};
$('local').onclick=()=>startGame(null);
$('resign').onclick=()=>{if(over||!conn)return;conn.send({t:'resign'});endUI("Siz taslim bo'ldingiz");};
$('again').onclick=()=>location.reload();
initPeer();
</script>
</body>
</html>
